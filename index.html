<body>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=IBM+Plex+Sans+KR:wght@400;600&display=swap">
<style>
/* 레이아웃: 탐사 지도 → 장비 꾸리기 → 장면 그림 + 한 칼럼 이야기. 콘셉트는 '탐사 기록지': 흰 모눈종이 위에 남색 잉크 픽셀 테두리, 헬멧 노랑과 탐사복 빨강을 포인트로. 의도적인 밝은 단일 테마. */
:root{
  --paper:#ffffff; --grid:#edf2f6; --ink:#1f2a36; --dim:#66727f; --navy:#22303f; --navy-2:#3c5068;
  --line:#c9d4de; --slot:#f3f6f9; --yellow:#f2b705; --yellow-2:#fff4c4; --red:#d9472b;
  --moss:#4f8a34; --water:#24879a; --cold:#4a6fb5; --danger:#c43c25;
  --flame:#b07800; --flame-2:#22303f; --stone:#c9d4de; --rock-2:#ffffff; --rock-3:#fff8db;
  --f-title:"Jua","IBM Plex Sans KR",sans-serif;
  --f-body:"Gowun Dodum","IBM Plex Sans KR",sans-serif;
  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;
  --light:1;
  color-scheme:light;
}
[hidden]{display:none!important}
*,*::before,*::after{border-radius:0!important;box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink);min-height:100%}
body{font-family:var(--f-body);font-size:17px;line-height:1.8;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.glow{position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(circle at 50% 35%,transparent calc(45% * var(--light) + 20%),rgba(31,42,54,calc(.2 - .18*var(--light))) 100%)}
.wrap{position:relative;z-index:1;max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
img.ptxt{display:block;image-rendering:pixelated;max-width:100%;height:auto}
img.logo{display:block;image-rendering:pixelated;width:100%;max-width:340px;height:auto}

/* 픽셀 테두리: 네 방향 그림자로 모서리를 깎는다 */
.pxf{box-shadow:0 -3px 0 0 var(--navy),0 3px 0 0 var(--navy),-3px 0 0 0 var(--navy),3px 0 0 0 var(--navy),3px 6px 0 0 var(--line),6px 3px 0 0 var(--line),6px 6px 0 0 var(--line)}

/* 머리말 */
header{display:flex;flex-direction:column;gap:12px;padding-bottom:14px;border-bottom:3px dashed var(--line)}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.top>div:first-child{flex:1;min-width:0}
@media (max-width:480px){.xp{padding:4px 8px}.xp b{font-size:18px}.sub{margin-top:2px}header{gap:8px}}
h1{margin:0}
.sub{font-family:var(--f-ui);font-size:12px;color:var(--dim);letter-spacing:.06em;margin-top:6px}
.xp{font-family:var(--f-ui);font-size:11px;color:var(--dim);text-align:center;background:var(--yellow-2);padding:6px 12px;
  box-shadow:0 -2px 0 0 var(--navy),0 2px 0 0 var(--navy),-2px 0 0 0 var(--navy),2px 0 0 0 var(--navy)}
.xp b{display:block;font-family:var(--f-title);font-size:22px;line-height:1.1;color:var(--navy);font-weight:400;font-variant-numeric:tabular-nums}
.hud{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;font-family:var(--f-ui);font-size:12px;color:var(--dim)}
.meter{display:flex;flex-direction:column;gap:4px;min-width:0}
.meter .lbl{display:flex;justify-content:space-between;letter-spacing:.06em}
.meter .lbl b{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.track{height:10px;background:var(--slot);box-shadow:0 -2px 0 0 var(--navy),0 2px 0 0 var(--navy),-2px 0 0 0 var(--navy),2px 0 0 0 var(--navy);overflow:hidden}
.fill{height:100%;transition:width .4s steps(6);background-image:repeating-linear-gradient(90deg,transparent 0 5px,rgba(255,255,255,.45) 5px 6px),linear-gradient(rgba(255,255,255,.35) 0 3px,transparent 3px)}
.m-bat .fill{background-color:var(--yellow)} .m-sta .fill{background-color:var(--moss)} .m-tmp .fill{background-color:var(--cold)}
.meter.low .fill{background-color:var(--danger)} .meter.low b{color:var(--danger)}
.lamp{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-family:var(--f-ui);font-size:12px;color:var(--dim)}
.seg{display:inline-flex;gap:3px;padding:3px;background:var(--navy)}
.seg button{font-family:var(--f-title);font-size:14px;color:var(--line);background:var(--navy-2);border:0;padding:3px 12px;cursor:pointer}
.seg button.on{background:var(--yellow);color:var(--navy)}
.seg button:disabled{opacity:.45;cursor:not-allowed}
.seg button:focus-visible{outline:2px solid var(--yellow);outline-offset:1px}
.lamp .hint{font-size:11px}

/* 패널 */
.panel,.frame,.pxbox,.cvdetail{background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:8px 8px;
  box-shadow:0 -3px 0 0 var(--navy),0 3px 0 0 var(--navy),-3px 0 0 0 var(--navy),3px 0 0 0 var(--navy),3px 6px 0 0 var(--line),6px 3px 0 0 var(--line),6px 6px 0 0 var(--line);
  padding:0 12px 12px;margin:3px;font-family:var(--f-ui);font-size:13px;color:var(--dim)}
.ttl{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;background:var(--yellow);margin:0 -12px 12px;padding:5px 10px 4px;border-bottom:3px solid var(--navy)}
.ttl span{font-family:var(--f-ui);font-size:12px;color:var(--navy);font-variant-numeric:tabular-nums}
.ttl.navy{background:var(--navy)} .ttl.navy span{color:var(--line)}

/* 슬롯 */
.slot{width:46px;height:46px;display:grid;place-items:center;position:relative;background:var(--slot);border:0;padding:0;cursor:pointer;flex:none;
  box-shadow:inset 2px 2px 0 #ffffff,inset -2px -2px 0 var(--line),0 -2px 0 0 var(--navy),0 2px 0 0 var(--navy),-2px 0 0 0 var(--navy),2px 0 0 0 var(--navy);margin:2px}
.slot:focus-visible{outline:2px solid var(--red);outline-offset:3px}
.slot.sel{background:var(--yellow-2);box-shadow:inset 2px 2px 0 #ffffff,inset -2px -2px 0 #f0d77a,0 -3px 0 0 var(--red),0 3px 0 0 var(--red),-3px 0 0 0 var(--red),3px 0 0 0 var(--red)}
.slot.empty{cursor:default;background:transparent;box-shadow:inset 0 0 0 2px var(--line)}
.slot.cont{background:repeating-linear-gradient(45deg,var(--slot) 0 3px,#e3e9ef 3px 6px)}
.slot.worn{cursor:default}
.slot .ico{width:32px;height:32px;image-rendering:pixelated;display:block}
.ico.big{width:44px;height:44px;image-rendering:pixelated;flex:none;background:var(--slot);padding:4px;box-shadow:0 -2px 0 0 var(--navy),0 2px 0 0 var(--navy),-2px 0 0 0 var(--navy),2px 0 0 0 var(--navy);margin:2px}
.cnt{position:absolute;right:2px;bottom:1px;font-family:var(--f-ui);font-size:11px;font-weight:700;line-height:1;color:#fff;text-shadow:1px 1px 0 var(--navy),-1px -1px 0 var(--navy),1px -1px 0 var(--navy),-1px 1px 0 var(--navy)}
.sz{position:absolute;left:3px;top:2px;font-size:6px;line-height:1;color:var(--navy-2);letter-spacing:0}
.star{position:absolute;right:2px;top:1px;font-size:10px;line-height:1;color:var(--red)}
.hotbar,.storegrid{display:flex;flex-wrap:wrap;gap:4px}
.packgrid{display:grid;grid-template-columns:repeat(6,50px);gap:2px}
@media (max-width:400px){.packgrid{grid-template-columns:repeat(6,46px)}.slot{width:42px;height:42px}}

.tip{display:flex;gap:10px;align-items:flex-start;margin-top:12px;background:#ffffff;padding:8px 10px;font-family:var(--f-ui);font-size:13px;color:var(--ink);line-height:1.55;box-shadow:inset 0 0 0 2px var(--line)}
.tip.muted{color:var(--dim)}
.tip .tx{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.tip .tx b{font-family:var(--f-title);font-size:17px;font-weight:400;color:var(--navy)}
.tip .tx b small{font-family:var(--f-ui);font-size:11px;color:var(--dim);margin-left:4px}
.tip .tx b small.rec{color:var(--red)}
.tip .meta{font-size:11px;color:var(--dim)}
.use{align-self:center;font-family:var(--f-title);font-size:15px;color:var(--navy);background:var(--yellow);border:0;padding:5px 14px;cursor:pointer;
  box-shadow:0 -2px 0 0 var(--navy),0 2px 0 0 var(--navy),-2px 0 0 0 var(--navy),2px 0 0 0 var(--navy),2px 4px 0 0 var(--navy);margin:2px 4px 4px 2px}
.use:active{transform:translate(2px,2px);box-shadow:0 -2px 0 0 var(--navy),0 2px 0 0 var(--navy),-2px 0 0 0 var(--navy),2px 0 0 0 var(--navy)}
.use:focus-visible{outline:2px solid var(--red);outline-offset:4px}

/* 장면 */
#art{display:block;width:100%;height:auto;image-rendering:pixelated;background:#1a1418;margin:3px 3px 16px;width:calc(100% - 6px);
  box-shadow:0 -3px 0 0 var(--navy),0 3px 0 0 var(--navy),-3px 0 0 0 var(--navy),3px 0 0 0 var(--navy),3px 6px 0 0 var(--line),6px 3px 0 0 var(--line),6px 6px 0 0 var(--line)}
.place{font-family:var(--f-ui);font-size:12px;letter-spacing:.14em;color:var(--flame);display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.place span{color:var(--dim);letter-spacing:.04em}
.place img.ptxt{display:inline-block}
.story p{margin:0 0 .9em;max-width:62ch}
.story .say{color:var(--water);padding-left:14px;position:relative}
.story .say::before{content:"";position:absolute;left:0;top:.45em;bottom:.45em;width:4px;background:repeating-linear-gradient(var(--water) 0 4px,transparent 4px 6px)}
.story .note{font-family:var(--f-ui);font-size:14px;color:var(--navy);background:var(--yellow-2);padding:6px 10px;box-shadow:inset 4px 0 0 var(--yellow)}
.story .bad{color:var(--danger);background:#fdece8;box-shadow:inset 4px 0 0 var(--danger)}
.story .rec{font-family:var(--f-ui);font-size:14px;color:var(--moss);background:#eef6e8;padding:6px 10px;box-shadow:inset 4px 0 0 var(--moss)}
.story .faint{color:var(--dim);font-style:italic}
.fade{animation:fade .45s steps(4) backwards}
@keyframes fade{from{opacity:.2}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}.fill{transition:none}}

/* 선택지 */
.choices{display:flex;flex-direction:column;gap:12px;padding:3px}
.choices button{font-family:var(--f-body);font-size:16px;text-align:left;color:var(--ink);background:var(--paper);border:0;padding:11px 14px 11px 30px;cursor:pointer;line-height:1.5;position:relative;
  box-shadow:0 -2px 0 0 var(--navy),0 2px 0 0 var(--navy),-2px 0 0 0 var(--navy),2px 0 0 0 var(--navy),0 5px 0 0 var(--line)}
.choices button::before{content:"";position:absolute;left:12px;top:50%;margin-top:-5px;width:0;height:0;border-left:7px solid var(--navy);border-top:5px solid transparent;border-bottom:5px solid transparent}
.choices button.gear::before{border:0;width:8px;height:8px;margin-top:-4px;background:var(--red);box-shadow:inset -2px -2px 0 #a5321c}
.choices button.record{background:#f6fbf2;box-shadow:0 -2px 0 0 var(--moss),0 2px 0 0 var(--moss),-2px 0 0 0 var(--moss),2px 0 0 0 var(--moss),0 5px 0 0 #cfe3c3}
.choices button.record::before{border:0;width:8px;height:8px;margin-top:-4px;background:var(--moss)}
.choices button.back::before{border-left:0;border-right:7px solid var(--dim)}
.choices button:hover:not([disabled]){background:var(--yellow-2)}
.choices button:active:not([disabled]){transform:translateY(3px);box-shadow:0 -2px 0 0 var(--navy),0 2px 0 0 var(--navy),-2px 0 0 0 var(--navy),2px 0 0 0 var(--navy)}
.choices button:focus-visible{outline:2px solid var(--red);outline-offset:5px}
.choices button[disabled]{opacity:.5;cursor:not-allowed}
.choices small{display:block;font-family:var(--f-ui);font-size:12px;color:var(--dim);margin-top:2px}

/* 지도 */
.tabs{display:flex;gap:10px;padding:3px;margin-bottom:6px}
.tabs button{font-family:var(--f-title);font-size:15px;color:var(--dim);background:var(--paper);border:0;padding:4px 14px;cursor:pointer;box-shadow:0 -2px 0 0 var(--line),0 2px 0 0 var(--line),-2px 0 0 0 var(--line),2px 0 0 0 var(--line)}
.tabs button.on{color:var(--navy);background:var(--yellow);box-shadow:0 -2px 0 0 var(--navy),0 2px 0 0 var(--navy),-2px 0 0 0 var(--navy),2px 0 0 0 var(--navy)}
.tabs button:disabled{cursor:not-allowed}
.maps{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);gap:18px;margin:12px 0 22px;align-items:start}
@media (max-width:560px){.maps{grid-template-columns:1fr}}
.maps.one{grid-template-columns:1fr}
.pxbox{padding:0 0 0}
.pxbox .cap-t{display:flex;align-items:center;justify-content:space-between;background:var(--navy);padding:4px 8px;border-bottom:3px solid var(--navy)}
.pxbox .cap-t span{font-family:var(--f-ui);font-size:11px;color:var(--line)}
.pxwrap{position:relative}
.pxwrap canvas{display:block;width:100%;height:auto;image-rendering:pixelated}
.mk{position:absolute;transform:translate(-50%,-80%);background:none;border:0;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center}
.mk .spr canvas{display:block;width:26px;height:auto;image-rendering:pixelated}
.mk .no{font-family:var(--f-ui);font-size:10px;font-weight:700;line-height:1;color:#fff;background:var(--navy);padding:2px 4px;margin-top:-1px}
.mk.sel .no{background:var(--red)}
.mk .tag{position:absolute;top:100%;margin-top:3px;white-space:nowrap;background:#fff;padding:1px 4px;box-shadow:0 -2px 0 0 var(--navy),0 2px 0 0 var(--navy),-2px 0 0 0 var(--navy),2px 0 0 0 var(--navy)}
.mk:hover .spr canvas{transform:translateY(-2px)}
.mk:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.zbox{position:absolute;box-shadow:0 0 0 2px var(--red);background:transparent;border:0;padding:0}
.zbox.act{cursor:pointer;background:rgba(242,183,5,.18);animation:zb 1s steps(2) infinite}
@keyframes zb{50%{box-shadow:0 0 0 3px var(--yellow)}}
@media (prefers-reduced-motion:reduce){.zbox.act{animation:none}}
.zbox:focus-visible{outline:2px solid var(--navy);outline-offset:3px}
.ztag{position:absolute;left:50%;top:100%;transform:translateX(-50%);margin-top:4px;white-space:nowrap;font-family:var(--f-title);font-size:13px;line-height:1.3;color:var(--navy);background:var(--yellow);padding:1px 6px;box-shadow:0 -2px 0 0 var(--navy),0 2px 0 0 var(--navy),-2px 0 0 0 var(--navy),2px 0 0 0 var(--navy)}
.mback{font-family:var(--f-title);font-size:14px;color:var(--navy);background:var(--yellow);border:0;padding:2px 10px;cursor:pointer}
.mback:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
.ev{position:absolute;transform:translate(-50%,-50%)}
.ev b{display:block;font-family:var(--f-title);font-size:12px;line-height:1;color:var(--navy);background:var(--yellow);padding:2px 5px;box-shadow:0 -2px 0 0 var(--navy),0 2px 0 0 var(--navy),-2px 0 0 0 var(--navy),2px 0 0 0 var(--navy)}
.evlist{font-family:var(--f-ui);font-size:12px;color:var(--ink);padding:10px 10px 0;display:flex;flex-direction:column;gap:6px}
.evlist b{font-family:var(--f-title);color:var(--navy);background:var(--yellow);padding:0 5px;margin-right:6px}
.evlist small{color:var(--dim);font-size:11px;margin-left:4px}
.cavelist{display:flex;flex-direction:column;gap:12px;margin-bottom:22px;padding:3px}
.cv{font-family:var(--f-ui);display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--paper);border:0;padding:9px 12px;cursor:pointer;text-align:left;color:var(--ink);width:100%;
  box-shadow:0 -2px 0 0 var(--navy),0 2px 0 0 var(--navy),-2px 0 0 0 var(--navy),2px 0 0 0 var(--navy),0 5px 0 0 var(--line)}
.cv:hover{background:var(--yellow-2)}
.cv.sel{background:var(--yellow-2);box-shadow:0 -3px 0 0 var(--red),0 3px 0 0 var(--red),-3px 0 0 0 var(--red),3px 0 0 0 var(--red),0 6px 0 0 #f1c2b8}
.cv:focus-visible{outline:2px solid var(--red);outline-offset:5px}
.cv .no{width:26px;height:26px;display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--navy);background:var(--yellow);box-shadow:inset -2px -2px 0 #c99500}
.cv.done .no{background:var(--moss);color:#fff;box-shadow:inset -2px -2px 0 #34601f}
.cv.lock .no{background:var(--line);color:var(--dim);box-shadow:inset -2px -2px 0 #a8b4c0}
.cv .nm{font-family:var(--f-title);font-size:17px;color:var(--navy)}
.cv .rg{font-size:12px;color:var(--dim)}
.cv .st{font-size:11px;color:var(--dim);text-align:right;font-variant-numeric:tabular-nums;line-height:1.5}
.cv.lock{opacity:.7}
.diff{display:inline-block;font-size:10px;letter-spacing:.06em;padding:0 5px;margin-left:6px;color:var(--navy);background:var(--slot);box-shadow:inset 0 0 0 1px var(--line);vertical-align:2px}
.cvdetail{font-family:var(--f-body);color:var(--ink);font-size:16px;margin-bottom:20px}
.cvdetail .meta{font-family:var(--f-ui);font-size:12px;color:var(--dim);margin:0 0 8px;letter-spacing:.04em}
.cvdetail p{margin:0 0 .8em;max-width:62ch}
.cvdetail.empty{padding-top:12px;color:var(--dim);font-size:15px}
.cvdetail.empty p{margin:0}
.cvstat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-bottom:12px;font-family:var(--f-ui);font-size:13px;color:var(--ink)}
.cvstat span{background:#fff;padding:4px 8px;box-shadow:inset 0 0 0 2px var(--line);min-width:0}
.cvstat i{display:block;font-style:normal;font-size:10px;letter-spacing:.08em;color:var(--dim)}
.cvstat .lockv{color:var(--danger)}
.thumb{display:block;width:100%;height:auto;image-rendering:pixelated;margin:0 0 12px;background:#1a1418;box-shadow:0 -2px 0 0 var(--navy),0 2px 0 0 var(--navy),-2px 0 0 0 var(--navy),2px 0 0 0 var(--navy)}
.maphint{font-family:var(--f-ui);font-size:13px;color:var(--dim);margin:4px 0 0}
.tomap{font-family:var(--f-title);font-size:15px;color:var(--navy);background:var(--yellow);border:0;padding:5px 14px;margin:3px 3px 18px;cursor:pointer;
  box-shadow:0 -2px 0 0 var(--navy),0 2px 0 0 var(--navy),-2px 0 0 0 var(--navy),2px 0 0 0 var(--navy),2px 4px 0 0 var(--navy)}
.tomap:active{transform:translate(2px,2px)}
.tomap:focus-visible{outline:2px solid var(--red);outline-offset:4px}
.realtip{display:flex;gap:10px;align-items:baseline;font-family:var(--f-ui);font-size:14px;color:var(--navy);background:var(--yellow-2);padding:8px 10px;margin:4px 0 12px;box-shadow:inset 4px 0 0 var(--yellow)}
.realtip b{flex:none;font-family:var(--f-title);font-weight:400;font-size:13px;color:#fff;background:var(--red);padding:0 6px}
.lvbar{display:inline-flex;gap:2px;vertical-align:middle;margin-left:4px}

/* ---- 공통 배경 ---- */
function caveBase(c,W,H,FL,r,seed,opt={}){
  const n=noise2(seed+"n");
  // 벽: 위로 갈수록 어둡게 + 층리(지층선)
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const t=y/H, v=n(x/14,y/9);
    let col=t<.35?(dith(x,y,(t/.35)*.7)?PX.rock2:PX.rock1):(v>.72?PX.rock3:(dith(x,y,.35)?PX.rock1:PX.rock2));
    if(v<.22)col=PX.rock1;
    R(c,x,y,1,1,col);
  }
  for(let k=0;k<6;k++){const y0=10+k*11+Math.floor(r()*4),amp=1+r()*2,ph=r()*6;
    for(let x=0;x<W;x++){const y=Math.round(y0+Math.sin(x/17+ph)*amp);if(r()<.8){R(c,x,y,1,1,PX.rock1);if(r()<.2)R(c,x,y+1,1,1,PX.rock3);}}}
  // 균열
  for(let k=0;k<4;k++){let x=Math.floor(r()*W),y=8+Math.floor(r()*30);for(let i=0;i<14;i++){R(c,x,y,1,1,PX.rock0);x+=r()<.5?1:0;y+=1;if(r()<.3)x--;}}
  // 반짝이는 방해석 점
  for(let i=0;i<40;i++)R(c,Math.floor(r()*W),Math.floor(r()*FL),1,1,r()<.5?PX.rock4:PX.calc3);
  // 천장 덩어리
  const ceil=[];for(let x=0;x<W;x++){ceil[x]=Math.round(5+n(x/10,40)*9);}
  for(let x=0;x<W;x++){R(c,x,0,1,ceil[x],PX.rock1);R(c,x,ceil[x]-1,1,1,PX.rock3);if(dith(x,0,.5))R(c,x,ceil[x]-2,1,1,PX.rock2);}
  // 바닥
  const fl=[];for(let x=0;x<W;x++){fl[x]=Math.round(FL-1+n(x/12,90)*4-2);}
  for(let x=0;x<W;x++){for(let y=fl[x];y<H;y++){const v=n(x/6,y/4+50);R(c,x,y,1,1,v>.6?PX.rock3:(dith(x,y,.5)?PX.rock2:PX.rock3));}R(c,x,fl[x],1,1,PX.rock4);if(r()<.4)R(c,x,fl[x]+1,1,1,PX.rock5);}
  // 자갈
  for(let i=0;i<16;i++){const x=Math.floor(r()*W),y=fl[Math.min(W-1,x)]+2+Math.floor(r()*(H-FL-3)),w=2+Math.floor(r()*3);R(c,x,y,w,2,PX.rock2);R(c,x,y,w,1,PX.rock4);R(c,x+w,y+1,1,1,PX.rock1);}
  return {ceil,fl};
}
function stalactite(c,x,y0,h,cols,drips){
  const [hi,mid,lo]=cols;
  for(let k=0;k<h;k++){const w=Math.max(1,Math.round((h-k)/h*4));const x0=x-Math.floor(w/2);
    R(c,x0,y0+k,w,1,mid);R(c,x0,y0+k,1,1,hi);if(w>2)R(c,x0+w-1,y0+k,1,1,lo);}
  R(c,x,y0+h,1,1,PX.water3); if(drips) drips.push({x,y:y0+h+1});
}
function stalagmite(c,x,yb,h,cols){
  const [hi,mid,lo]=cols;
  for(let k=0;k<h;k++){const w=Math.max(1,Math.round((h-k)/h*5));const x0=x-Math.floor(w/2);
    R(c,x0,yb-k,w,1,mid);R(c,x0,yb-k,1,1,hi);if(w>2)R(c,x0+w-1,yb-k,1,1,lo);}
}
function column(c,x,top,bot,w){
  for(let y=top;y<bot;y++){const bulge=Math.round(Math.sin((y-top)/(bot-top)*Math.PI*3)*0.8);
    const ww=w+(y<top+6?Math.round((top+6-y)/2):0)+(y>bot-7?Math.round((y-bot+7)/1.5):0)+bulge;const x0=x-Math.floor(ww/2);
    R(c,x0,y,ww,1,PX.calc2);R(c,x0,y,1,1,PX.calc);R(c,x0+1,y,1,1,PX.calc);R(c,x0+ww-1,y,1,1,PX.calc3);if(y%5===0)R(c,x0+1,y,ww-2,1,PX.calc3);}
}

const PT_CACHE={};
function ptxt(text,o={}){
  const size=o.size||12,col=o.color||"#22303f",sh=o.shadow===undefined?"#f2b705":o.shadow,scale=o.scale||2;
  const key=[text,size,col,sh,scale].join("|");
  if(!PT_CACHE[key]){
    const cv=document.createElement("canvas"),c=cv.getContext("2d");
    const font=`bold ${size}px "Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic","Nanum Gothic",sans-serif`;
    c.font=font;const w=Math.ceil(c.measureText(text).width)+3,h=size+5;
    cv.width=w;cv.height=h;c.font=font;c.textBaseline="alphabetic";c.fillStyle="#000";c.fillText(text,1,size);
    const im=c.getImageData(0,0,w,h),d=im.data,on=new Uint8Array(w*h);
    for(let i=0;i<w*h;i++)on[i]=d[i*4+3]>100?1:0;
    const o2=document.createElement("canvas");o2.width=w;o2.height=h;const c2=o2.getContext("2d");
    for(let y=0;y<h;y++)for(let x=0;x<w;x++){if(on[y*w+x]){if(sh&&x+1<w&&y+1<h&&!on[(y+1)*w+x+1]){c2.fillStyle=sh;c2.fillRect(x+1,y+1,1,1);}}}
    for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(on[y*w+x]){c2.fillStyle=col;c2.fillRect(x,y,1,1);}
    PT_CACHE[key]={src:o2.toDataURL(),w,h};
  }
  const P=PT_CACHE[key];
  return `<img class="ptxt" src="${P.src}" width="${P.w*scale}" height="${P.h*scale}" alt="${text}">`;
}

let meTab="pro",meSel="lamp",lkSel="food",lkMsg="",svSel="gossi";
function svLayout(id){
  const C=CAVES[id],N=C.nodes,pos={},par={},order=[C.start],r=rng("lay:"+id);
  pos[C.start]=[0,0];const ang={[C.start]:(r()-.5)*.6};
  for(let i=0;i<order.length;i++){const k=order[i];
    const kids=[...new Set(N[k].c.map(c=>c.go).filter(g=>g&&!(g in pos)))];
    kids.forEach((g,j)=>{const a=ang[k]+(j-(kids.length-1)/2)*1.05+(r()-.5)*.35,L=Math.max(22,N[g].len);
      pos[g]=[pos[k][0]+Math.cos(a)*L,pos[k][1]+Math.sin(a)*L*.85];ang[g]=a;par[g]=k;order.push(g);});}
  const E=[],seen=new Set();order.forEach(k=>N[k].c.forEach(c=>{if(!c.go||!(c.go in pos))return;const key=[k,c.go].sort().join("|");if(!seen.has(key)&&k!==c.go){seen.add(key);E.push([k,c.go]);}}));
  return {pos,order,E};
}
function drawSurvey(cv,id,sv){
  if(!cv)return;const W=200,H=120,c=mkCtx(cv,W,H),{pos,order,E}=svLayout(id),N=CAVES[id].nodes;
  R(c,0,0,W,H,"#f7f3e3");for(let x=0;x<W;x+=10)R(c,x,0,1,H,x%50?"#e6ecef":"#cfdbe3");for(let y=0;y<H;y+=10)R(c,0,y,W,1,y%50?"#e6ecef":"#cfdbe3");
  const xs=order.map(k=>pos[k][0]),ys=order.map(k=>pos[k][1]),x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  const sc=Math.min((W-36)/Math.max(1,x1-x0),(H-34)/Math.max(1,y1-y0));
  const P2=k=>[Math.round(18+(pos[k][0]-x0)*sc+((W-36)-(x1-x0)*sc)/2),Math.round(14+(pos[k][1]-y0)*sc+((H-34)-(y1-y0)*sc)/2)];
  const line=(a,b,col,w,dash)=>{let [x,y]=a;const [X,Y]=b,dx=Math.abs(X-x),dy=-Math.abs(Y-y),sx=x<X?1:-1,sy=y<Y?1:-1;let e=dx+dy,i=0;
    for(;;){if(!dash||(i>>1)%2===0)R(c,x-(w>>1),y-(w>>1),w,w,col);i++;if(x===X&&y===Y)break;const e2=2*e;if(e2>=dy){e+=dy;x+=sx;}if(e2<=dx){e+=dx;y+=sy;}}};
  const q=k=>sv[k]||0;
  E.forEach(([a,b])=>{if(q(a)&&q(b))line(P2(a),P2(b),q(a)>1&&q(b)>1?"#e3d2a6":"#f0dccd",7);});
  E.forEach(([a,b])=>{if(q(a)&&q(b))line(P2(a),P2(b),q(a)>1&&q(b)>1?"#22324a":"#c0503a",1,!(q(a)>1&&q(b)>1));});
  order.forEach(k=>{if(!q(k))return;const [x,y]=P2(k);
    if(k===CAVES[id].start){R(c,x-3,y-3,7,7,"#22324a");R(c,x-2,y-2,5,5,"#f2b705");}
    else if(N[k].goal){R(c,x-2,y-2,5,5,"#d9472b");R(c,x,y-8,1,7,"#22324a");R(c,x+1,y-8,4,3,"#d9472b");}
    else{R(c,x-2,y-2,5,5,"#22324a");R(c,x-1,y-1,3,3,q(k)>1?"#ffffff":"#f0a090");}});
  // 방위표 · 축척
  R(c,W-10,6,1,11,"#22324a");R(c,W-12,8,5,1,"#22324a");R(c,W-11,7,3,1,"#22324a");R(c,W-10,5,1,1,"#d9472b");
  const m20=Math.round(20*sc);R(c,6,H-7,m20,2,"#22324a");R(c,6,H-10,1,5,"#22324a");R(c,6+m20,H-10,1,5,"#22324a");
  const wrap=cv.parentElement;wrap.querySelectorAll(".svn").forEach(e=>e.remove());
  order.forEach((k,i)=>{if(!q(k))return;const [x,y]=P2(k),s=document.createElement("span");s.className="svn"+(q(k)>1?"":" err");s.textContent=i+1;s.style.left=(x/W*100)+"%";s.style.top=(y/H*100)+"%";wrap.appendChild(s);});
  const sb=document.createElement("span");sb.className="svn sb";sb.textContent="20m";sb.style.left=((6+m20+4)/W*100)+"%";sb.style.top=((H-8)/H*100)+"%";wrap.appendChild(sb);
}
function svPage(){

function end(k){

    P.trips=(P.trips||0)+1;
    S.rec.forEach(r=>{if(!p.recs.includes(r)){p.recs.push(r);newRecs++;}});
    if(S.f.goal&&!p.goal){p.goal=1;goalNew=1;}
  }
  let earn=0;const gotPermits=safe?(S.drops||[]):[];

    const c=svCount(S.cave,o);if(c.ok===c.n&&!p.svDone){p.svDone=1;svBonus=Math.round(50000*moneyMul()/100)*100;P.money+=svBonus;gainDet(10);}}

$("tLogo").innerHTML=drawLogo();
$("tStart").onclick=startGame;
$("toTitle").onclick=()=>{if(S.phase==="cave"&&!confirmLeave())return;showTitle();};
$("nvMap").onclick=()=>{if(S.phase==="cave"||S.phase==="event")return;selCave=null;newRun();renderMap();window.scrollTo(0,0);};
$("nvMe").onclick=()=>openMe();
$("nvShop").onclick=()=>{if(S.phase==="cave"||S.phase==="event")return;openShop(S.phase==="prep"?"prep":"map");};
const MSCOPE={pro:"프로필·진행",gear:"장비 강화",dex:"도감",relic:"유물",map:"측량도",stock:"창고"};
function mBar(sc){return MASTER&&MSCOPE[sc]?`<div class="mbar2"><span>마스터 · ${MSCOPE[sc]}</span><button data-ms="${sc}" data-mt="reset">초기화</button><button data-ms="${sc}" data-mt="fill">완성</button></div>`:"";}
function masterAct(sc,act){const F=act==="fill";
  if(sc==="pro"){P.detxp=F?DET_XP[DET_XP.length-1]:0;P.money=F?9999999:60000;P.trips=F?Math.max(P.trips||0,30):0;P.endings=F?Object.keys(ENDINGS):[];P.permits=F?Object.fromEntries(PLAYABLE.map(id=>[id,1])):{};PLAYABLE.forEach(id=>{const c=cp(id);c.goal=F?1:0;if(!F)c.runs=0;});P.sta=F?staMax():100;P.staT=Date.now();}
  if(sc==="gear"){const v=F?{t:2,e:ENH_MAX}:{t:0,e:0};P.gear.lamp={...v};SRT_PARTS.forEach(([k])=>P.gear.srt[k]={...v});P.enh=99;}
  if(sc==="dex") PLAYABLE.forEach(id=>{cp(id).recs=F?[...CAVES[id].recs]:[];});
  if(sc==="relic"){P.relics={};if(F)RELICS.forEach(x=>P.relics[x.id]=1);}
  if(sc==="map") PLAYABLE.forEach(id=>{const c=cp(id);c.sv={};c.svDone=F?1:0;if(F)Object.keys(CAVES[id].nodes).forEach(k=>c.sv[k]=2);});
  if(sc==="stock"){P.stock={};if(F)Object.keys(GEAR).forEach(k=>{if(k!=="helmet")P.stock[k]=5;});if(!F)P.loadout={};}
  saveP();toast(`마스터: ${MSCOPE[sc]} ${F?"완성":"초기화"}`);render();}
document.addEventListener("click",e=>{const b=e.target.closest&&e.target.closest("[data-mt]");if(!b||!MASTER)return;masterAct(b.dataset.ms,b.dataset.mt);});
function masterFill(){
  RELICS.forEach(x=>P.relics[x.id]=1);
  P.detxp=Math.max(P.detxp||0,DET_XP[DET_XP.length-1]);
  PLAYABLE.forEach(id=>{const c=cp(id);c.recs=[...new Set([...(c.recs||[]),...CAVES[id].recs])];const o=svOf(id);Object.keys(CAVES[id].nodes).forEach(k=>o[k]=2);c.svDone=1;});
  saveP();
}
if(MASTER&&!P.mInit){masterFill();P.mInit=1;saveP();}
newRun(); renderMap(); showTitle(); if(!MASTER) initCloud(); else {saveWhere="마스터 전용 저장";document.title="웰컴 투 동굴 : 마스터";}
</script>

</body>
</html>
